<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
        }

        header, footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main {
            background-color: #4caf50;
            padding: 20px;
            color: white;
        }

        .sidebar {
            background-color: #2196f3;
            padding: 20px;
            color: white;
        }

        @media(min-width: 600px) {
            .content {
                flex-direction: row;
            }

            .main {
                background-color: red;
                flex: 2;
            }

            .sidebar {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cabeçalho</h1>
    </header>
    <div class="container">
        <div class="content">
            <div class="main"> 
                <p>Conteúdo Principal</p>
            </div>
            <div class="sidebar">
                <p>Barra Lateral</p>
            </div>
        </div>
    </div>
    <footer>
        <h2>Rodapé</h2>
    </footer>
</body>
</html>
