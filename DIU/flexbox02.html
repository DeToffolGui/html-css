<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            background-color: gray;
            margin: 10px;
        }

        .container2{
            display: flex;
            flex-direction: column;
            background-color: gray;
            margin: 10px;
        }

        .container div, .container2 div{
            background-color: green;
            margin: 10px;
            padding: 10px;
            font-size: 18px;
            color: white;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
    <div class="container2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
