<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;/**/
        }

        body {
            margin: 0px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.274);/*direta, baixo, espalhamento*/
            width: 100%;
            max-width: 400px;
        }

        .form-container h2{
            text-align: center;
            margin-bottom: 25px;
            background-origin: #333;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;/*Deixa alinhados*/
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .form-group input:focus, 
        .form-group textarea:focus,
        .form-group select:focus {/*quando clica*/
            outline: none;
            border-color: #4a90e2;
        }

        .form-group textarea {
            resize: vertical; /*so deixa aumentar ou diminuir verticalmente*/
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.5s ease, transform 0.5s ease;
        }

        .submit-btn:hover {
            background-color: #357ab8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Formulário de Contato</h2>
        <form action="envio.php" method="post">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="assunto">Assunto:</label>
                <select name="assunto" id="assunto">
                    <option value="">Selecione</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" required></textarea>
            </div>

            <button class="submit-btn" type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
