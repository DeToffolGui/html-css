<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table.tabela1 {
            width: 400px;
            border-collapse: collapse;
            border: 5px solid red;
        }

        tr.linha {
            background-color: gray;
        }
        
        

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center; /*alinhamento horizontal - right, left*/
            vertical-align: middle;/*Alinhamento vertical - top, bottom*/
        }

        .numero {
            text-align: right;
        }

        td.dado {
            background-color: yellow;
        }


        table.tabela2 {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            
        }
    </style>
</head>
<body>
    <h1>Primeira tabela</h1>
    
    <!--hierarquia de tabelas-->
    <!--TABLE
            TABLE ROW
                TABLE HEADER
                    TABLE DATA
                    -->
    <table class="tabela1">        
        <tr> <!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr class="linha"> <!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>

        <tr> <!--Terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        
        <tr> <!--Quarta linha-->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
    </table>
    <br>


    <table class="tabela2">        
        <tr> <!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr> <!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>

        <tr> <!--Terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        
        <tr> <!--Quarta linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>


    </table>
</body>
</html>
