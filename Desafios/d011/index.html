<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Astronauta</title>
</head>
<body>
    <style>
        body{
            margin: 0px;
            padding: 0px;
        }

        #espaco {
            background-size: 100% 100%;
            
            height: 100vh;
            
            background-image: url(espaco.jpg);
        }

        #astronauta {
            background-size: 100% 100%;
            position: absolute;

            width: 30vw; /* largura responsiva */
            height: 30vw;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background-image: url(astronauta.png);
        } 
    </style>
    <div id="espaco">
        <div id="astronauta"></div>
    </div>
    
</body>
</html>
